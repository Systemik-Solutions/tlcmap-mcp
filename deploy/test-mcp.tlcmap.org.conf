# Apache vhosts for test-mcp.tlcmap.org. Requires: a2enmod proxy proxy_http headers ssl
# Run `certbot --apache -d test-mcp.tlcmap.org` after installing; it adds the certificate lines
# to the 443 vhost.

<VirtualHost *:80>
    ServerName test-mcp.tlcmap.org
    Redirect permanent / https://test-mcp.tlcmap.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName test-mcp.tlcmap.org

    SSLEngine on
    # SSLCertificateFile and SSLCertificateKeyFile are added by certbot.

    ProxyPreserveHost On
    ProxyTimeout 90
    RequestHeader set X-Forwarded-Proto https

    # flushpackets=on sends each SSE event to the client as soon as the server writes it.
    ProxyPass / http://127.0.0.1:3100/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3100/

    # No compression on the MCP endpoint, so single-event SSE replies are not buffered.
    <Location /mcp>
        SetEnv no-gzip 1
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/test-mcp.tlcmap.org-error.log
    CustomLog ${APACHE_LOG_DIR}/test-mcp.tlcmap.org-access.log combined
</VirtualHost>
