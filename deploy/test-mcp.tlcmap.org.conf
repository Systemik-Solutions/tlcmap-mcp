# Apache vhosts for test-mcp.tlcmap.org. Requires: a2enmod proxy proxy_http headers ssl
#
# The *:443 vhost is only read once the certificate exists, so installing this file before
# `certbot certonly --apache -d test-mcp.tlcmap.org` leaves just the *:80 vhost active and cannot
# stop Apache.

<VirtualHost *:80>
    ServerName test-mcp.tlcmap.org
    Redirect permanent / https://test-mcp.tlcmap.org/
</VirtualHost>

<IfFile /etc/letsencrypt/live/test-mcp.tlcmap.org/fullchain.pem>
<VirtualHost *:443>
    ServerName test-mcp.tlcmap.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/test-mcp.tlcmap.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test-mcp.tlcmap.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyTimeout 90
    RequestHeader set X-Forwarded-Proto https

    # flushpackets=on sends each SSE event to the client as soon as the server writes it.
    # retry=0 retries the backend on the next request, so a connection refused during a
    # restart does not leave the worker in error for the default 60 s.
    ProxyPass / http://127.0.0.1:3100/ flushpackets=on retry=0
    ProxyPassReverse / http://127.0.0.1:3100/

    # No compression on the MCP endpoint, so single-event SSE replies are not buffered.
    <Location /mcp>
        SetEnv no-gzip 1
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/test-mcp.tlcmap.org-error.log
    CustomLog ${APACHE_LOG_DIR}/test-mcp.tlcmap.org-access.log combined
</VirtualHost>
</IfFile>
